<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Gradiente Azul Cobalto -->
    <linearGradient id="cobaltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003882"/>
      <stop offset="50%" stop-color="#0047AB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Gradiente Gris Metálico -->
    <linearGradient id="metallicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="45%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Gradiente Pantalla Reloj -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Sombra suave para profundidad -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#001F4D" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Escudo de Base de Datos (Azul Cobalto) -->
  <g filter="url(#dropShadow)">
    <path d="M 100 16 
             C 142 16, 172 30, 172 30 
             C 172 106, 138 156, 100 182 
             C 62 156, 28 106, 28 30 
             C 28 30, 58 16, 100 16 Z" 
          fill="url(#cobaltGrad)" />
          
    <!-- Brillo y reflejo de ángulo del escudo -->
    <path d="M 100 20 
             C 138 20, 166 33, 166 33 
             C 166 102, 134 150, 100 174 Z" 
          fill="#ffffff" 
          opacity="0.1" />

    <!-- Estratos / Anillos de Base de Datos relacional -->
    <path d="M 52 54 C 68 46, 132 46, 148 54 C 148 62, 148 62, 148 62 C 132 70, 68 70, 52 62 Z" 
          fill="#ffffff" 
          opacity="0.16" />
    <path d="M 52 68 C 68 60, 132 60, 148 68 C 148 76, 148 76, 148 76 C 132 84, 68 84, 52 76 Z" 
          fill="#ffffff" 
          opacity="0.12" />
  </g>

  <!-- Reloj Digital sobre el Escudo (Gris Metálico + LCD) -->
  <g transform="translate(0, 14)">
    <!-- Bisel / Caja de reloj en Gris Metálico -->
    <rect x="40" y="80" width="120" height="54" rx="14" ry="14" 
          fill="url(#metallicGrad)" 
          stroke="#CBD5E1" 
          stroke-width="1.8" 
          filter="url(#dropShadow)" />
          
    <!-- Pantalla digital interior -->
    <rect x="48" y="88" width="104" height="38" rx="8" ry="8" 
          fill="url(#screenGrad)" 
          stroke="#475569" 
          stroke-width="1.2" />

    <!-- Indicador LED de precisión en tiempo real (Verde Activo) -->
    <circle cx="140" cy="97" r="3" fill="#22C55E" />

    <!-- Dígitos del reloj digital -->
    <text x="96" y="115" 
          font-family="'Consolas', 'Courier New', monospace" 
          font-size="22" 
          font-weight="bold" 
          fill="#38BDF8" 
          text-anchor="middle" 
          letter-spacing="2"
          style="text-shadow: 0 0 6px rgba(56, 189, 248, 0.7);">
      08:00
    </text>
  </g>
</svg>
